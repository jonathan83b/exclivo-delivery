<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Cardápio - Exclivo</title>
    <link rel="stylesheet" href="css/admin.css">
     <link rel="stylesheet" href="css/gerenciar-cardapio.css">
     <link rel="icon" href="img/favcompizza.png" type="image/png">
</head>

<body>

    <header class="admin-header">
        <h1>EXCLIVO - Gestão de Cardápio</h1>
        <div class="admin-actions">
            <a href="admin.html" class="btn-site">📦 Ir para Pedidos</a>
            <a href="index.html" class="btn-site" target="_blank">🍕 Ver Cardápio</a>
            <button style="background: #64748b; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 500;" onclick="fazerLogout()">🚪 Sair</button>
        </div>
    </header>

    <main class="admin-container">

        <div class="menu-manager-grid">

            <!-- Formulário de Adicionar / Editar -->
            <div class="card-form">
                <h3 id="form-titulo">➕ Cadastrar Novo Item</h3>
                
                <form id="form-produto" onsubmit="salvarProduto(event)">
                    <input type="hidden" id="prod-id">

                    <div class="form-group">
                        <label for="prod-nome">Nome do Produto *</label>
                        <input type="text" id="prod-nome" placeholder="Ex: Pizza Baiana" required>
                    </div>

                    <div class="form-group">
                        <label for="prod-categoria">Categoria *</label>
                        <select id="prod-categoria" required>
                            <option value="pizzas">🍕 Pizzas</option>
                            <option value="bebidas">🥤 Bebidas</option>
                            <option value="sobremesas">🍰 Sobremesas</option>
                            <option value="hamburgueres">🍔 Hambúrgueres</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="prod-preco">Preço (R$) *</label>
                        <input type="number" id="prod-preco" step="0.01" placeholder="35.00" required>
                    </div>

                    <div class="form-group">
                        <label for="prod-opcao">Tipo de Opções / Adicionais</label>
                        <select id="prod-opcao">
                            <option value="nenhuma">Nenhuma (Item Simples)</option>
                            <option value="borda">Permitir Borda Recheada</option>
                            <option value="copos">Checkbox Copos Descartáveis</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="prod-descricao">Descrição / Ingredientes</label>
                        <textarea id="prod-descricao" placeholder="Molho, queijo..."></textarea>
                    </div>

                    <button type="submit" class="btn-save" id="btn-submit">Salvar Produto</button>
                    <button type="button" class="btn-cancel" id="btn-cancel" onclick="cancelarEdicao()">Cancelar Edição</button>
                </form>
            </div>

            <!-- Tabela de Itens do Cardápio -->
            <div class="catalog-table-card">
                <h3>📋 Itens Cadastrados no Cardápio</h3>
                
                <table class="catalog-table">
                    <thead>
                        <tr>
                            <th>Ordem</th>
                            <th>Item</th>
                            <th>Categoria</th>
                            <th>Preço</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-produtos-gerenciador">
                        <!-- Itens renderizados dinamicamente pelo JavaScript -->
                    </tbody>
                </table>
            </div>

        </div>

    </main>

    <script src="js/gerenciar-cardapio.js"></script>
</body>

</html>
