<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurante - Login da Equipe</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff7ed',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="../assets/css/painel.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-brand-500 selection:text-white">

  <!-- Modal Central de Login -->
  <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
    
    <!-- Identidade do Sistema -->
    <div class="text-center space-y-2">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-600 to-amber-500 flex items-center justify-center text-white shadow-lg shadow-brand-500/20 font-bold text-2xl mx-auto mb-3">
        <i class="fa-solid fa-utensils"></i>
      </div>
      <h1 class="text-2xl font-extrabold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Restaurante</h1>
      <p class="text-xs text-slate-400">Portal de Acesso Restrito da Equipe</p>
    </div>

    <!-- Seleção do Perfil (Garçom vs Cozinha vs Admin) -->
    <div class="space-y-2">
      <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider text-center">Selecione seu Perfil</label>
      <div class="grid grid-cols-3 gap-2 sm:gap-3">
        
        <!-- Opção Garçom -->
        <div id="btn-role-garcom" class="role-card active bg-brand-500/10 border-2 border-brand-500 rounded-2xl p-3 text-center cursor-pointer transition-all">
          <div class="w-9 h-9 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center mx-auto mb-2 text-base">
            <i class="fa-solid fa-user-tie"></i>
          </div>
          <p class="font-bold text-xs text-white">Garçom</p>
          <p class="text-[9px] text-slate-400 mt-0.5 line-clamp-1">Mesas/Comanda</p>
        </div>

        <!-- Opção Cozinha -->
        <div id="btn-role-cozinha" class="role-card bg-slate-950 border-2 border-slate-800 rounded-2xl p-3 text-center cursor-pointer opacity-60 hover:opacity-100 transition-all">
          <div class="w-9 h-9 rounded-xl bg-brand-500/20 text-brand-400 flex items-center justify-center mx-auto mb-2 text-base">
            <i class="fa-solid fa-fire-burner"></i>
          </div>
          <p class="font-bold text-xs text-white">Cozinha</p>
          <p class="text-[9px] text-slate-400 mt-0.5 line-clamp-1">KDS e Pratos</p>
        </div>

        <!-- Opção Admin -->
        <div id="btn-role-admin" class="role-card bg-slate-950 border-2 border-slate-800 rounded-2xl p-3 text-center cursor-pointer opacity-60 hover:opacity-100 transition-all">
          <div class="w-9 h-9 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto mb-2 text-base">
            <i class="fa-solid fa-user-shield"></i>
          </div>
          <p class="font-bold text-xs text-white">Admin</p>
          <p class="text-[9px] text-slate-400 mt-0.5 line-clamp-1">Gestão e CRM</p>
        </div>

      </div>
    </div>

    <!-- Form de PIN -->
    <form id="form-login-equipe" class="space-y-4">
      <div>
        <label id="label-perfil-nome" class="block text-xs font-semibold text-slate-300 mb-1 text-center">
          Acesso do Garçom (PIN Padrão: 1234)
        </label>
        <div class="relative">
          <input type="password" id="input-pin" required maxlength="8" placeholder="Digite o PIN de acesso" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-center text-lg font-bold text-white tracking-widest focus:border-brand-500 focus:outline-none shadow-inner placeholder:text-xs placeholder:tracking-normal placeholder:font-normal">
        </div>
      </div>

      <!-- Alerta de Erro -->
      <div id="msg-erro" class="hidden bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs text-center py-2.5 px-3 rounded-xl font-semibold">
        PIN de acesso incorreto!
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-500 hover:to-brand-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-brand-500/25 transition-all text-sm flex items-center justify-center space-x-2">
        <i class="fa-solid fa-right-to-bracket"></i>
        <span>Entrar no Painel</span>
      </button>
    </form>

    <div class="text-center border-t border-slate-800/80 pt-4">
      <a href="../cliente/index.html?mesa=1" class="text-xs text-slate-500 hover:text-slate-300 underline">
        Voltar para a Visão do Cliente (Mesa)
      </a>
    </div>

  </div>

  <script src="../assets/js/login.js"></script>
</body>
</html>
