<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio Digital - Nossos Produtos</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Import do CSS Separado -->
  <link rel="stylesheet" href="assets/css/catalogo.css">
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center pb-16">

  <!-- Contentor Principal -->
  <div class="w-full max-w-md mx-auto flex flex-col min-h-screen">

    <!-- Cabeçalho do Catálogo -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-30 shadow-lg px-4 py-4 flex items-center space-x-3">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center text-white shadow-lg shadow-orange-500/20 font-bold text-xl">
        <i class="fa-solid fa-utensils"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-white leading-tight">Restaurante Sabor & Arte</h1>
        <p class="text-xs text-emerald-400 font-semibold flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Aberto agora • Faça seu pedido
        </p>
      </div>
    </header>

    <!-- Conteúdo / Lista de Produtos -->
    <main class="w-full px-4 pt-4 space-y-4 flex-grow">

      <!-- Banner WhatsApp -->
      <div class="bg-gradient-to-r from-emerald-950/40 to-slate-900 border border-emerald-500/30 rounded-2xl p-4 shadow-xl flex items-center justify-between">
        <div class="space-y-1">
          <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Atendimento Rápido</h2>
          <p class="text-[11px] text-slate-300">Escolha o produto e clique para encomendar pelo WhatsApp.</p>
        </div>
        <div class="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-lg flex-shrink-0 border border-emerald-500/30">
          <i class="fa-brands fa-whatsapp"></i>
        </div>
      </div>

      <!-- Barra de Pesquisa -->
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-xs"></i>
        <input type="text" id="search-catalogo" oninput="filtrarProdutos()" placeholder="O que deseja saborear hoje?" class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white focus:border-orange-500 focus:outline-none placeholder-slate-500 shadow-inner">
      </div>

      <!-- Lista de Produtos -->
      <div id="grid-catalogo" class="grid grid-cols-1 gap-3.5">
        <!-- Injetado via JS -->
      </div>

    </main>

    <!-- Rodapé -->
    <footer class="text-center pt-6 pb-4 border-t border-slate-900 mt-6 px-4">
      <p class="text-[11px] text-slate-500">© 2026 Restaurante - Todos os direitos reservados.</p>
    </footer>

  </div>

  <!-- Import do JavaScript Separado -->
  <script src="assets/js/catalogo.js"></script>
</body>
</html>
